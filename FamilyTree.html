<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='7' r='5' fill='%232563eb'/%3E%3Ccircle cx='7' cy='25' r='5' fill='%23e07a3f'/%3E%3Ccircle cx='25' cy='25' r='5' fill='%232f9e8f'/%3E%3Cpath d='M16 12v6M7 20v-2h18v2' stroke='%23334155' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --ink:#1d2430; --ink2:#5d6673; --line:#8a94a3; --border:#dfe3e8;
  --card:#ffffff; --card-line:#d6dbe2; --card-dead:#f2f0ec; --card-dup:#fafbfc;
  --accent:#2563eb; --accent2:#f59e0b; --chip:#e8eefc; --chip-line:#b9c8ef; --badge:#334155; --couple:#c27b9c;
  --shadow:0 10px 30px rgba(15,23,42,.14),0 2px 6px rgba(15,23,42,.08);
  --dot:#d5dae2; --male:#3f7fd8; --female:#d9578b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b; --panel:#1a2029; --ink:#e7ebf0; --ink2:#9aa5b4; --line:#6b7686; --border:#2c3440;
    --card:#1f2630; --card-line:#344050; --card-dead:#22252a; --card-dup:#1b2028;
    --chip:#1e2b44; --chip-line:#34508a; --badge:#475569; --dot:#252c36;
    --shadow:0 10px 30px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:root{--barH:52px}
#bar{position:fixed;top:0;left:0;right:0;min-height:52px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);z-index:20}
.brand{display:flex;align-items:center;gap:6px;flex:none}
.logo{font-size:22px}
.title{font-weight:700;font-size:16px;padding:3px 6px;border-radius:6px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;cursor:text}
.title:hover{background:var(--bg)}
.title[contenteditable="true"]{outline:2px solid var(--accent);background:var(--card)}
.grp{display:flex;align-items:center;gap:4px;flex:none}
.seg{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.seg button:disabled{opacity:.4;cursor:default}
.ib,select{border:1px solid var(--border);background:var(--panel);padding:5px 10px;border-radius:8px;white-space:nowrap;min-height:31px}
.ib:hover,select:hover{border-color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default;border-color:var(--border)}
#btnCollapse.warn{background:#fff4e8;border-color:#e07a3f;color:#9a4a16;font-weight:600}
#btnCollapse .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:3px;border-radius:9px;background:#e07a3f;color:#fff;font-size:11px;line-height:17px;text-align:center}
.primary{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}
.spacer{flex:1}
.search input{width:180px;border:1px solid var(--border);background:var(--bg);padding:5px 10px;border-radius:8px;min-height:31px}
.search input:focus{outline:2px solid var(--accent);background:var(--panel)}
#searchInfo{font-size:12px;color:var(--ink2);min-width:0}
#banner{position:fixed;top:var(--barH);left:0;right:0;background:#fff7e0;color:#6b4e00;border-bottom:1px solid #f1d58a;padding:6px 14px;font-size:13px;z-index:19}
#stage{position:fixed;top:var(--barH);left:var(--anL,0px);right:var(--anR,0px);bottom:var(--anB,0px);outline:none;
  background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:24px 24px}
body.has-banner #stage{top:calc(var(--barH) + 32px)}
#svg{width:100%;height:100%;display:block;cursor:grab;user-select:none;touch-action:none}
#svg.panning{cursor:grabbing}
#svg.linking{cursor:crosshair}
.card{cursor:pointer}
#hint{position:absolute;left:12px;bottom:10px;font-size:12.5px;color:var(--ink2);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:5px 10px;max-width:calc(100% - 260px);pointer-events:none}
#hint:empty{display:none}
#status{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--ink2);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:5px 10px}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.empty-card{pointer-events:auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:30px 34px;text-align:center;max-width:520px;margin:16px}
.empty-card .big{font-size:46px}
.empty-card h1{margin:4px 0 6px;font-size:22px}
.empty-card p{color:var(--ink2);margin:0 0 16px}
.empty-card .row{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.empty-card button{border:1px solid var(--border);background:var(--bg);padding:10px 16px;border-radius:10px}
.empty-card button:hover{border-color:var(--accent)}
#inline{position:fixed;z-index:40;border:2px solid var(--accent);border-radius:8px;padding:4px 8px;background:var(--card);font-weight:600;box-shadow:var(--shadow);outline:none}
.menu{position:fixed;z-index:50;min-width:230px;max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:5px}
.menu .mi{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.menu .mi:hover{background:var(--chip)}
.menu .mi .k{margin-left:auto;color:var(--ink2);font-size:12px;padding-left:16px}
.menu .mi.dis{opacity:.4;pointer-events:none}
.menu .mh{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);padding:7px 10px 3px}
.menu .sep{height:1px;background:var(--border);margin:4px 2px}
.menu .chips{display:flex;gap:4px;padding:3px 8px 6px;flex-wrap:wrap}
.menu .chips button{border:1px solid var(--border);background:var(--bg);border-radius:6px;padding:3px 8px;font-size:12.5px}
.menu .chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pop{position:fixed;z-index:45;width:360px;height:auto;min-width:280px;min-height:180px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);resize:both;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.pop h3{margin:-14px -14px 10px;padding:12px 14px 8px;font-size:15px;display:flex;align-items:center;gap:8px;cursor:move;user-select:none;position:sticky;top:-14px;background:var(--panel);z-index:1;border-bottom:1px solid var(--border)}
.pop h3 .x{margin-left:auto;border:0;background:transparent;font-size:18px;color:var(--ink2)}
.pop .f{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.pop label{display:flex;flex-direction:column;font-size:11.5px;color:var(--ink2);gap:3px;min-width:0}
.pop label.w{grid-column:1/-1}
.pop input,.pop textarea{width:100%;min-width:0;border:1px solid var(--border);background:var(--bg);border-radius:7px;padding:6px 8px;font-size:13.5px;color:var(--ink)}
.pop input:focus,.pop textarea:focus{outline:2px solid var(--accent);background:var(--panel)}
.pop textarea{min-height:64px;resize:vertical}
.pop .tg{display:flex;gap:4px;min-width:0}
.pop .tg button{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--border);background:var(--bg);border-radius:7px;padding:5px}
.pop .tg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pop .rels{margin-top:10px;font-size:12.5px}
.pop .rels .rl{color:var(--ink2);margin:6px 0 3px}
.pop .chip{display:inline-block;border:1px solid var(--chip-line);background:var(--chip);border-radius:20px;padding:2px 9px;margin:2px;cursor:pointer;font-size:12.5px}
.pop .ph{display:flex;align-items:center;gap:10px;grid-column:1/-1;flex-wrap:wrap}
.pop .ph img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
.pop .ph button,.pop .sw button{border:1px solid var(--border);background:var(--bg);border-radius:7px;padding:4px 9px;font-size:12.5px}
.pop .sw{display:flex;gap:5px;align-items:center;grid-column:1/-1;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.pop .sw i{width:20px;height:20px;border-radius:50%;display:inline-block;cursor:pointer;border:2px solid transparent}
.pop .sw i.on{border-color:var(--ink)}
.pop .ro{font-size:13.5px}
.pop .ro div{margin:3px 0}
#toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);z-index:60;background:#1f2937;color:#fff;padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;max-width:90vw}
#toast button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:2px 10px}
#modal{position:fixed;inset:0;z-index:70;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:min(720px,100%);min-width:300px;min-height:160px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto;resize:both;padding:20px 22px;display:flex;flex-direction:column}
.modal-box > *{flex:none}
.modal-box .cols{flex:1 1 auto;min-height:200px}
.modal-box h2{margin:0 0 8px;font-size:18px}
.modal-box p{color:var(--ink2);margin:6px 0}
.modal-box textarea{width:100%;height:100%;min-height:200px;resize:none;border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:10px;font:13.5px/1.5 ui-monospace,Consolas,monospace;color:var(--ink)}
.modal-box .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-box pre{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;min-height:200px;height:100%;overflow:auto;margin:0;font:12.5px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap}
.modal-box .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.modal-box .acts button,.modal-box .opt button{border:1px solid var(--border);background:var(--bg);border-radius:9px;padding:8px 14px}
.modal-box .opt{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.modal-box .opt button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.modal-box table{border-collapse:collapse;width:100%;font-size:13px}
.modal-box td{padding:4px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.modal-box kbd{background:var(--bg);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:12px}
.modal-box label.ck{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.file-menu .mi .ico{width:20px;text-align:center}
/* ---- Tell the Tree (voice) column ---- */
#voice{position:fixed;top:var(--barH);right:0;bottom:0;width:var(--voiceW,360px);min-width:280px;max-width:80vw;background:var(--panel);border-left:1px solid var(--border);z-index:18;display:flex;flex-direction:column;padding:12px 14px;gap:9px;overflow:hidden}
body.has-banner #voice{top:calc(var(--barH) + 32px)}
body.voice-open #stage{right:calc(var(--voiceW,360px) + var(--anR,0px))}
#vGrip{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2}
#vGrip:hover,#vGrip.on{background:var(--accent);opacity:.35}
.v-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.v-head b{font-size:16px}
.v-sub{font-size:12px;color:var(--ink2)}
.v-head .x{margin-left:auto;border:0;background:transparent;font-size:17px;color:var(--ink2)}
.v-mic{display:flex;gap:8px;align-items:center}
#vMic{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:12px;padding:13px;background:var(--accent);color:#fff;font-weight:600;font-size:15px}
#vMic .dot{width:12px;height:12px;border-radius:50%;background:#fff;opacity:.85}
#vMic.on{background:#dc2626}
#vMic.on .dot{animation:vpulse 1s infinite}
@keyframes vpulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
#vLang,#vEngine{max-width:170px}
.v-mic{flex-wrap:wrap}
#vMic{transition:box-shadow .08s}
.v-state{font-size:12.5px;color:var(--ink2);min-height:18px}
.v-state.err{color:#dc2626}
.v-live{min-height:44px;border:1px dashed var(--border);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--ink)}
.v-live:empty::before{content:'What you say appears here…';color:var(--ink2);font-style:italic}
.v-live i{color:var(--ink2)}
.v-ctx{font-size:12.5px;color:var(--ink2)}
#vCtx{display:inline-block;border:1px solid var(--chip-line);background:var(--chip);color:var(--ink);border-radius:20px;padding:1px 9px;margin-left:2px}
.v-type textarea{width:100%;resize:none;border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13.5px;color:var(--ink)}
.v-type textarea:focus{outline:2px solid var(--accent);background:var(--panel)}
.v-btns{display:flex;gap:6px}
.v-btns button{flex:1;border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:6px}
.v-btns button:hover{border-color:var(--accent)}
.v-btns button:disabled{opacity:.4;cursor:default}
.v-examples{border:1px solid var(--border);border-radius:10px;padding:6px;max-height:220px;overflow:auto;font-size:12.5px}
.v-examples div{padding:5px 7px;border-radius:6px;cursor:pointer}
.v-examples div:hover{background:var(--chip)}
.v-examples .vh{font-weight:700;color:var(--ink2);cursor:default;text-transform:uppercase;font-size:10.5px;letter-spacing:.05em}
.v-examples .vh:hover{background:none}
.v-log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:7px;min-height:60px}
.v-entry{border:1px solid var(--border);border-radius:10px;padding:7px 9px;font-size:12.5px;background:var(--bg)}
.v-entry .said{font-weight:600;margin-bottom:3px;color:var(--ink)}
.v-entry .said::before{content:'\201C'}.v-entry .said::after{content:'\201D'}
.v-entry .m{color:#15803d}.v-entry .m.bad{color:#dc2626}
.v-entry .eu{float:right;border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:1px 8px;font-size:11.5px;margin-left:6px}
.v-entry.undone{opacity:.45}.v-entry.undone .said{text-decoration:line-through}
.v-note{font-size:11px;color:var(--ink2);border-top:1px solid var(--border);padding-top:6px}
@media (max-width:900px){#voice{width:100%;top:auto;height:55%;border-left:0;border-top:1px solid var(--border)}body.voice-open #stage{right:0;bottom:55%}}
@media (max-width:760px){
  .modal-box .cols{grid-template-columns:1fr}
  .search input{width:120px}
  #hint{display:none}
}
@media print{#bar,#hint,#status,#banner{display:none}#stage{top:0}}
/* Always-visible voice button (bottom-right of the tree) */
#fabVoice{position:absolute;right:16px;bottom:52px;z-index:5;border:0;border-radius:28px;padding:12px 18px;background:var(--accent);color:#fff;font-weight:600;font-size:14.5px;box-shadow:var(--shadow)}
#fabVoice:hover{filter:brightness(1.1)}
body.voice-open #fabVoice{display:none}

/* resize corner hint */
.pop::-webkit-resizer,.modal-box::-webkit-resizer{background:linear-gradient(135deg,transparent 50%,var(--line) 50%,var(--line) 60%,transparent 60%,transparent 72%,var(--line) 72%,var(--line) 82%,transparent 82%)}
.modal-box h2{cursor:default}
/* mic inside the name box */
#inlineMic{position:fixed;z-index:41;width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:16px;box-shadow:var(--shadow);transition:box-shadow .08s}
#inlineMic.on{background:#dc2626}
#inlineMic.busy{background:#d97706}
/* legend dropdown */
.legend{width:430px}
.legend .lg{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;align-items:center;font-size:12.8px}
.legend .lg svg{width:96px;height:40px;overflow:visible}
.legend h4{margin:12px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.legend h4:first-of-type{margin-top:0}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:2px;vertical-align:-1px}

/* ---------------- Analytics window ---------------- */
#an{position:fixed;z-index:30;background:var(--bg);display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:280px;min-height:160px}
#an.dock-right{border-left:1px solid var(--border)}#an.dock-left{border-right:1px solid var(--border)}#an.dock-bottom{border-top:1px solid var(--border)}
#an.dock-float{border:1px solid var(--border);border-radius:12px;resize:both;overflow:hidden;z-index:35}
#an.dock-max{box-shadow:none}
#anSplit{position:absolute;z-index:3;background:transparent;transition:background .15s}
#anSplit:hover,body.an-dragging #anSplit{background:var(--accent)}
#an.dock-right #anSplit{left:-3px;top:0;bottom:0;width:6px;cursor:ew-resize}
#an.dock-left #anSplit{right:-3px;top:0;bottom:0;width:6px;cursor:ew-resize}
#an.dock-bottom #anSplit{top:-3px;left:0;right:0;height:6px;cursor:ns-resize}
#an.dock-float #anSplit,#an.dock-max #anSplit{display:none}
body.an-dragging{user-select:none}body.an-dragging #stage{pointer-events:none}
#anHead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--border);user-select:none}
#an.dock-float #anHead{cursor:move;border-radius:12px 12px 0 0}
.an-title{font-size:14.5px;white-space:nowrap}.an-sp{flex:1}
#anTabs{display:flex;flex-wrap:wrap;gap:3px}
#anTabs button,.an-win button{border:1px solid var(--border);background:var(--panel);color:var(--ink);border-radius:7px;padding:4px 9px;font-size:13px;min-height:28px}
#anTabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.an-win{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.an-win .an-sizes,.an-win .an-docks{display:inline-flex;gap:2px;padding:0 4px;border-left:1px solid var(--border)}
.an-win button{padding:3px 7px;min-width:28px}.an-win button.on{background:var(--chip);border-color:var(--chip-line)}
.an-win button:hover,#anTabs button:hover{border-color:var(--accent)}
#anBody{flex:1;overflow:auto;padding:12px 14px 40px}
#anTabPill{position:fixed;right:16px;bottom:12px;z-index:31;border:0;border-radius:20px;padding:9px 16px;background:#1f2937;color:#fff;font-weight:600;box-shadow:var(--shadow)}
#btnAnalytics.on{background:var(--chip);border-color:var(--chip-line)}
body.an-open #fabVoice{bottom:12px}
.an-empty{padding:40px 10px;text-align:center;color:var(--ink2);font-size:15px}
.an-scope{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 10px;color:var(--ink2);font-size:13px}
.an-scope select,.an-scope input[list]{border:1px solid var(--border);background:var(--panel);color:var(--ink);border-radius:7px;padding:5px 8px;min-width:220px;max-width:100%}
.an-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;align-items:start}
.an-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-width:0;overflow:auto}
.an-card.wide{grid-column:1/-1}
.an-card h4{margin:0 0 10px;font-size:14px}.an-card h4 small,.an-card h5{color:var(--ink2);font-weight:500}
.an-card h5,#anBody>h5{margin:12px 0 6px;font-size:12.5px;color:var(--ink2)}
.na{color:var(--ink2);font-size:12.5px}.ok{color:#2f9e8f}
.an-n{display:inline-block;min-width:22px;padding:0 6px;border-radius:9px;background:var(--chip);color:var(--accent);font-weight:700;text-align:center;cursor:pointer;text-decoration:none}
.an-n:hover{background:var(--accent);color:#fff}.an-n.zero{background:transparent;color:var(--ink2);cursor:default}
.an-n.miss{background:#fde8dd;color:#b4501d}.an-n.miss:hover{background:#e07a3f;color:#fff}

<script>
window.FT_PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
/* ==== model.js ==== */
/* FT.Model — data store, relationship queries, mutations, undo/redo. */
window.FT = window.FT || {};
(function () {
  'use strict';
  const uid = (p) => p + Math.random().toString(36).slice(2, 10);
  FT.uid = uid;

  function blankPerson(o) {
    o = o || {};
    return {
      id: o.id || uid('p'), given: o.given || '', surname: o.surname || '', nick: o.nick || '',
      gender: o.gender || 'U',
      birth: { date: (o.birth && o.birth.date) || '', place: (o.birth && o.birth.place) || '' },
      death: { date: (o.death && o.death.date) || '', place: (o.death && o.death.place) || '' },
      living: o.living === undefined ? null : o.living,
      photo: o.photo || '', notes: o.notes || '', tags: o.tags || [], color: o.color || '',
      gotra: o.gotra || '', native: o.native || '', altName: o.altName || '',
      photoSrc: o.photoSrc || '', photoCrop: o.photoCrop || null
    };
  }
  function blankFamily(o) {
    o = o || {};
    return {
      id: o.id || uid('f'), partners: o.partners || [], children: o.children || [],
      childRel: o.childRel || {}, status: o.status || '',
      marriage: { date: (o.marriage && o.marriage.date) || '', place: (o.marriage && o.marriage.place) || '' }
    };
  }
  function emptyData() {
    const now = new Date().toISOString();
    return { version: 1, meta: { id: uid('t'), title: 'Our Family', created: now, modified: now }, people: {}, families: {}, settings: {} };
  }
  FT.blankPerson = blankPerson;
  FT.emptyData = emptyData;

  /** Extract a 3-4 digit year from free-text date. */
  FT.year = function (s) {
    if (!s) return null;
    const m = String(s).match(/(\d{4})(?!.*\d{4})/) || String(s).match(/\b(\d{3})\b/);
    return m ? parseInt(m[1], 10) : null;
  };

  class Model {
    constructor() {
      this.data = emptyData();
      this.undoStack = []; this.redoStack = [];
      this.listeners = [];
      this._batch = null;
      this.readOnly = false;
    }
    on(fn) { this.listeners.push(fn); }
    emit(kind) { this.listeners.forEach((fn) => fn(kind || 'change')); }

    /** Replace all data (normalises every record). */
    load(data, keepHistory) {
      const d = emptyData();
      if (data) {
        d.version = 1;
        d.meta = Object.assign(d.meta, data.meta || {});
        d.settings = Object.assign({}, data.settings || {});
        Object.values(data.people || {}).forEach((p) => { d.people[p.id] = blankPerson(p); });
        Object.values(data.families || {}).forEach((f) => {
          const nf = blankFamily(f);
          nf.partners = nf.partners.filter((x) => d.people[x]);
          nf.children = nf.children.filter((x) => d.people[x]);
          d.families[nf.id] = nf;
        });
      }
      this.data = d;
      if (!keepHistory) { this.undoStack = []; this.redoStack = []; }
      this.emit('load');
    }

    /** Run a mutation as one undoable step. */
    change(fn, label) {
      if (this.readOnly) return;
      if (this._batch) { const r = fn(); this._batch.dirty = true; return r; }
      const before = JSON.stringify(this.data);
      const r = fn();
      const after = JSON.stringify(this.data);
      if (before !== after) {
        this.undoStack.push(before);
        if (this.undoStack.length > 300) this.undoStack.shift();
        this.redoStack = [];
        this.data.meta.modified = new Date().toISOString();
        this.emit(label || 'change');
      }
      return r;
    }
    /** Group many edits (e.g., a details popover session) into one undo step. */
    beginBatch() { if (!this._batch) this._batch = { before: JSON.stringify(this.data), dirty: false }; }
    batchChanged() { this.data.meta.modified = new Date().toISOString(); this.emit('change'); }
    endBatch() {
      const b = this._batch; this._batch = null;
      if (b && JSON.stringify(this.data) !== b.before) { this.undoStack.push(b.before); this.redoStack = []; }
    }
    canUndo() { return this.undoStack.length > 0; }
    canRedo() { return this.redoStack.length > 0; }
    undo() {
      if (!this.undoStack.length) return;
      this.redoStack.push(JSON.stringify(this.data));
      this.data = JSON.parse(this.undoStack.pop()); this.emit('undo');
    }
    redo() {
      if (!this.redoStack.length) return;
      this.undoStack.push(JSON.stringify(this.data));
      this.data = JSON.parse(this.redoStack.pop()); this.emit('redo');
    }

    // ---------- queries ----------
    get people() { return this.data.people; }
    get families() { return this.data.families; }
    person(id) { return this.data.people[id]; }
    count() { return Object.keys(this.data.people).length; }
    famsAsPartner(pid) { return Object.values(this.data.families).filter((f) => f.partners.includes(pid)); }
    famsAsChild(pid) { return Object.values(this.data.families).filter((f) => f.children.includes(pid)); }
    parentFamily(pid) {
      const fs = this.famsAsChild(pid);
      return fs.find((f) => (f.childRel[pid] || 'birth') === 'birth') || fs[0] || null;
    }
    parents(pid) { const f = this.parentFamily(pid); return f ? f.partners.slice() : []; }
    partners(pid) {
      const out = [];
      this.famsAsPartner(pid).forEach((f) => f.partners.forEach((x) => { if (x !== pid && !out.includes(x)) out.push(x); }));
      return out;
    }
    children(pid) {
      const out = [];
      this.famsAsPartner(pid).forEach((f) => f.children.forEach((c) => { if (!out.includes(c)) out.push(c); }));
      return out;
    }
    siblings(pid) {
      const out = [];
      this.famsAsChild(pid).forEach((f) => {
        f.children.forEach((c) => { if (c !== pid && !out.includes(c)) out.push(c); });
        f.partners.forEach((par) => this.children(par).forEach((c) => { if (c !== pid && !out.includes(c)) out.push(c); }));
      });
      return out;
    }
    ancestors(pid) {
      const seen = new Set(); const st = [pid];
      while (st.length) { const x = st.pop(); this.parents(x).forEach((p) => { if (!seen.has(p)) { seen.add(p); st.push(p); } }); }
      return seen;
    }
    descendants(pid) {
      const seen = new Set(); const st = [pid];
      while (st.length) { const x = st.pop(); this.children(x).forEach((c) => { if (!seen.has(c)) { seen.add(c); st.push(c); } }); }

    // centre parents over the child, but report where the connector starts
    shiftX(u, -mid);
    return { u, mid: 0, couple: pf.partners.length === 2, rel: pf.childRel[pid] || 'birth' };
  }

  // ---------------- composition ----------------
  function finalize(u, ctx) {
    const M = ctx.model;
    const shown = new Set(u.nodes.filter((n) => !n.dup).map((n) => n.pid));
    u.nodes.forEach((n) => {
      n.y = n.d * S.ROW;
      if (!n.dup) {
        const ps = M.parents(n.pid);
        n.parentsHidden = ps.length > 0 && !ps.some((p) => shown.has(p));
      }
    });
    u.edges.forEach((e) => { e.y = e.d * S.ROW; if (e.kids) e.kids.forEach((k) => { k.y = k.d * S.ROW; }); });
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    u.nodes.forEach((n) => {
      x0 = Math.min(x0, n.x - S.W / 2); x1 = Math.max(x1, n.x + S.W / 2);
      y0 = Math.min(y0, n.y); y1 = Math.max(y1, n.y + S.H);
    });
    if (!u.nodes.length) { x0 = y0 = 0; x1 = y1 = 1; }
    u.bbox = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
    return u;
  }

  /**
   * Free moves: opts.free[pid] = {dx, dy} shifts that person, their partners and everyone below them
   * anywhere on the canvas (no collision rules). Lines into the moved branch stretch to follow it.
   */
  function applyFree(L, model, free) {
    const ids = Object.keys(free || {}).filter((id) => model.person(id));
    if (!ids.length) return;
    const nodeOf = (id) => L.nodes.find((n) => n.pid === id && !n.dup);
    // parents' moves first, so moves inside a moved branch add up
    ids.sort((a, b) => ((nodeOf(a) || { d: 0 }).d - (nodeOf(b) || { d: 0 }).d));
    ids.forEach((id) => {
      const n = nodeOf(id), off = free[id];
      if (!n || !off || (!off.dx && !off.dy)) return;
      const set = new Set([id]);
      model.descendants(id).forEach((x) => set.add(x));
      Array.from(set).forEach((x) => model.partners(x).forEach((p) => set.add(p)));
      const y0 = n.y; // remember before n itself moves
      const inBranch = (pid, y) => set.has(pid) && y >= y0;
      L.nodes.forEach((m) => { if (inBranch(m.pid, m.y)) { m.x += off.dx; m.y += off.dy; } });
      L.edges.forEach((e) => {
        if (e.type === 'couple') {
          const f = model.families[e.fam];
          if (f && f.partners.every((p) => set.has(p)) && e.y >= y0) { e.x1 += off.dx; e.x2 += off.dx; e.y += off.dy; }
          return;
        }
        const f = model.families[e.fam];
        const parentsIn = f && f.partners.length && f.partners.some((p) => set.has(p)) && e.y >= y0;
        if (parentsIn) { e.x += off.dx; e.y += off.dy; }
        e.kids.forEach((k) => { if (k.pid ? set.has(k.pid) && k.y >= y0 : parentsIn) { k.x += off.dx; k.y += off.dy; k.free = true; } });
      });
    });
    let x0 = Infinity, x1 = -Infinity, ya = Infinity, yb = -Infinity;
    L.nodes.forEach((m) => { x0 = Math.min(x0, m.x - S.W / 2); x1 = Math.max(x1, m.x + S.W / 2); ya = Math.min(ya, m.y); yb = Math.max(yb, m.y + S.H); });
    L.bbox = { x: x0, y: ya, w: x1 - x0, h: yb - ya };
  }

  function makeCtx(model, opts) {
    return {
      model, placed: new Set(), rootDepth: 0, nextBranch: 0,
      collapsed: new Set(opts.collapsed || []), collapsedUp: new Set(opts.collapsedUp || []),
      maxDown: opts.maxDown || 0, maxUp: opts.maxUp || 0, allowed: opts.allowed || null, gaps: opts.gaps || null,
      branching: opts.branching !== false
    };
  }

  /**
   * compute(model, opts) -> {nodes, edges, bbox}
   * opts.view: 'everyone' | 'descendants' | 'ancestors' | 'hourglass'; opts.rootId
   */
  FT.Layout = {
    compute(model, opts) {
      const L = this._compute(model, opts || {});
      applyFree(L, model, (opts || {}).free);
      return L;
    },
    _compute(model, opts) {
      opts = opts || {};
      const ctx = makeCtx(model, opts);
      const view = opts.view || 'everyone';
      let root = opts.rootId && model.person(opts.rootId) ? opts.rootId : null;
      if (!model.count()) return finalize(unit(), ctx);
      if (view === 'everyone' || !root) {
        const all = unit(); let first = true;
        const place = (r) => {
          const u = desc(r, ctx, 0, null);
          if (!first) shiftX(u, placeAfter(all, u, S.CLAN, gapOf(ctx, r)));
          absorb(all, u); first = false;
        };
        model.roots().forEach(place);
        // people folded away inside a collapsed branch must stay hidden
        const folded = new Set();
        ctx.collapsed.forEach((c) => {
          if (!ctx.placed.has(c)) return;
          model.descendants(c).forEach((d) => { folded.add(d); model.partners(d).forEach((p) => folded.add(p)); });
        });
        // safety: anybody unreachable from a root
        Object.keys(model.people).forEach((id) => { if (!ctx.placed.has(id) && !folded.has(id)) place(id); });
        return finalize(all, ctx);
      }
      if (view === 'descendants') return finalize(desc(root, ctx, 0, null), ctx);
      if (view === 'ancestors') {
        const u = unit(); ctx.placed.add(root); ctx.branching = false;
        addNode(u, { pid: root, x: 0, d: 0, root: true });
        const up = ancAbove(root, ctx, 0);
        if (up) { absorb(u, up.u); u.edges.push({ type: 'kids', x: up.mid, d: -1, couple: up.couple, kids: [{ x: 0, d: 0, rel: up.rel }] }); }
        return finalize(u, ctx);
      }
      // hourglass: parents' family (with siblings) + descendants, ancestors above both parents
      ctx.branching = false;
      const pf = model.parentFamily(root);
      if (!pf || !pf.partners.length || ctx.collapsedUp.has(root)) return finalize(desc(root, ctx, 0, null), ctx);
      ctx.rootDepth = 0;
      const lower = desc(pf.partners[0], ctx, 0, null);
      ctx.rootDepth = 0;
      const parentNodes = pf.partners.map((p) => lower.nodes.find((n) => n.pid === p && !n.dup)).filter(Boolean);
      const ups = parentNodes.map((n) => {
        const a = ancAbove(n.pid, ctx, 0);
        if (!a) return null;
        shiftX(a.u, n.x); return { a, n };
      }).filter(Boolean);
      if (ups.length === 2) {
        const need = separation(ups[0].a.u, ups[1].a.u, S.SG * 2);
        if (need > 0) { shiftX(ups[0].a.u, -need / 2); shiftX(ups[1].a.u, need / 2); ups[0].off = -need / 2; ups[1].off = need / 2; }
      }
      ups.forEach((x) => {
        absorb(lower, x.a.u);
        lower.edges.push({ type: 'kids', x: x.n.x + (x.off || 0), d: -1, couple: x.a.couple, kids: [{ x: x.n.x, d: 0, rel: x.a.rel }] });
      });
      // focus person's siblings are all in "lower"; mark the focus as root for emphasis
      lower.nodes.forEach((n) => { n.root = n.pid === root && !n.dup; });
      return finalize(lower, ctx);
    },
    /** People kept when "show only this branch" is on. */
    branchSet(model, pid) {
      const s = new Set([pid]);
      model.descendants(pid).forEach((x) => s.add(x));
      model.ancestors(pid).forEach((x) => s.add(x));
      Array.from(s).forEach((x) => model.partners(x).forEach((p) => s.add(p)));
      return s;
    }
  };
})();

/* ==== render.js ==== */
/* FT.Render — draws a layout into an SVG <g>. Styling lives inside the SVG so exports keep it. */
window.FT = window.FT || {};
(function () {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const S = FT.SIZE;
  FT.BRANCH_COLORS = ['#e07a3f', '#2f9e8f', '#7b61c9', '#d4a017', '#3a7fd0', '#c2477a', '#5d9c3a', '#9a6b3f', '#2b8fb3', '#b85450'];
  const GEN_COLORS = ['#6c5ce7', '#0984e3', '#00a085', '#e1a100', '#e17055', '#d63081', '#636e72'];
  const GENDER = { M: '#3f7fd8', F: '#d9578b', U: '#9aa0a6' };

  FT.SVG_STYLE = `
  .card .bg{fill:var(--card,#fff);stroke:var(--card-line,#d9dde3);stroke-width:1.2}
  .card .stripe{}
  .card .nm{font:600 13.5px system-ui,Segoe UI,sans-serif;fill:var(--ink,#1d2430)}
  .card .sub{font:12px system-ui,Segoe UI,sans-serif;fill:var(--ink2,#5d6673)}
  .card .ini{font:600 15px system-ui,Segoe UI,sans-serif;fill:#fff}
  .card.dead .bg{fill:var(--card-dead,#f3f1ee)}
  .card.dup .bg{stroke-dasharray:5 4;fill:var(--card-dup,#fafbfc)}
  .card.sel .bg{stroke:var(--accent,#2563eb);stroke-width:3}
  .card.root .bg{stroke:var(--accent2,#f59e0b);stroke-width:2.4}
  .card.sel.root .bg{stroke:var(--accent,#2563eb)}
  .card.rel .bg{stroke:#16a34a;stroke-width:3}
  .card.dim{opacity:.16}
  .card.hit .bg{stroke:#f59e0b;stroke-width:3.5}
  .card.drop .bg{stroke:#16a34a;stroke-width:4}
  .ln{fill:none;stroke:var(--line,#8a94a3);stroke-width:1.6}
  .ln.adopted,.ln.step,.ln.foster{stroke-dasharray:6 4}
  .ln.couple{stroke:var(--couple,#c27b9c);stroke-width:2.2}
  .ln.divorced,.ln.separated{stroke-dasharray:3 4}
  .ln.dim{opacity:.12}
  .ln.sib{stroke:#0d9488;stroke-width:2;stroke-dasharray:2 5;stroke-linecap:round}
  .sibt{font:italic 11px system-ui,Segoe UI,sans-serif;fill:#0d9488}
  .badge rect{fill:var(--badge,#334155)} .badge text{font:600 11px system-ui,sans-serif;fill:#fff}
  .badge{cursor:pointer}
  .up rect{fill:var(--chip,#e8eefc);stroke:var(--chip-line,#b9c8ef)} .up text{font:600 11px system-ui,sans-serif;fill:var(--accent,#2563eb)}
  .up{cursor:pointer}
  .h{cursor:pointer;opacity:0;transition:opacity .12s}
  .h circle{fill:var(--accent,#2563eb);stroke:#fff;stroke-width:2}
  .h text{font:700 15px system-ui,sans-serif;fill:#fff;pointer-events:none}
  .card:hover .h,.card.sel .h{opacity:.92}
  .h:hover{opacity:1!important} .h:hover circle{fill:#16a34a}
  .ro .h{display:none}
  .ch{cursor:grab;opacity:0;transition:opacity .12s}
  .ch circle{fill:#f59e0b;stroke:#fff;stroke-width:2}
  .card:hover .ch,.card.sel .ch{opacity:.95}
  .ch:hover circle{fill:#16a34a}
  .card.moving{opacity:.75}
  .lines.moving{opacity:.25}
  .edit-ic{opacity:0;cursor:pointer} .card:hover .edit-ic{opacity:.75} .edit-ic:hover{opacity:1}
  .edit-ic circle{fill:var(--card,#fff);stroke:var(--card-line,#cbd2db)} .edit-ic text{font:12px system-ui;fill:var(--ink2,#5d6673)}
  `;

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  FT.svgEl = el;

  function fit(text, max) { return text.length > max ? text.slice(0, max - 1) + '…' : text; }
  function initials(p) { return ((p.given || '?')[0] + ((p.surname || '')[0] || '')).toUpperCase(); }
  function years(M, p) {
    const b = FT.year(p.birth.date), dd = FT.year(p.death.date);
    const living = M.isLiving(p);
    if (b && dd) return b + ' – ' + dd;
    if (b && !living) return b + ' – †';
    if (b) return 'b. ' + b + (living ? '  ·  ' + (new Date().getFullYear() - b) + ' yrs' : '');
    if (dd) return '† ' + dd;
    if (!living) return 'Late';
    return p.nick ? '“' + p.nick + '”' : '';
  }

  /** Smooth elbow from (x1,y1) down to (x2,y2) via a bus at yb. */
  function elbow(x1, y1, x2, y2, yb) {
    if (Math.abs(x1 - x2) < 1) return `M${x1},${y1}V${y2}`;
    const r = Math.min(10, Math.abs(x2 - x1) / 2, Math.abs(y2 - yb), Math.abs(yb - y1));
    const s = x2 > x1 ? 1 : -1;
    return `M${x1},${y1}V${yb - r}Q${x1},${yb} ${x1 + s * r},${yb}H${x2 - s * r}Q${x2},${yb} ${x2},${yb + r}V${y2}`;
  }

  FT.Render = {
    /**
     * draw(g, layout, state) — state: {model, selected:Set, focusSet, colorBy, readOnly, relId, hit}
     */
    draw(g, L, st) {
      const M = st.model;
      while (g.firstChild) g.removeChild(g.firstChild);
      const lines = el('g', { class: 'lines' }, g);
      const cards = el('g', { class: 'cards' }, g);
      const dimOf = (pid) => st.focusSet && !st.focusSet.has(pid);

      L.edges.forEach((e) => {
        if (e.type === 'couple') {
          const y = e.y + S.H / 2;
          const fam = M.families[e.fam];
          const a = fam && fam.partners[0], b = fam && fam.partners[1];
          const dim = st.focusSet && (dimOf(a) || dimOf(b));
          el('path', { d: `M${e.x1},${y}H${e.x2}`, class: 'ln couple ' + (e.status || '') + (dim ? ' dim' : '') }, lines);
          if (e.status === 'divorced' || e.status === 'separated') {
            const mx = (e.x1 + e.x2) / 2;
            el('path', { d: `M${mx - 5},${y + 7}L${mx - 1},${y - 7}M${mx + 1},${y + 7}L${mx + 5},${y - 7}`, class: 'ln couple' }, lines);
          }
          return;
        }
        const y1 = e.couple ? e.y + S.H / 2 : e.y + S.H;
        const yb = e.y + S.H + S.V / 2;
        e.kids.forEach((k) => {
          const dim = st.focusSet && k.pid && dimOf(k.pid);
          // a freely placed child can be anywhere, so use a smooth curve instead of the right-angled elbow
          const d = k.free || k.y < yb + 4
            ? `M${e.x},${y1}C${e.x},${y1 + 90} ${k.x},${k.y - 90} ${k.x},${k.y}`
            : elbow(e.x, y1, k.x, k.y, yb);
          el('path', { d, class: 'ln ' + (k.rel || '') + (dim ? ' dim' : '') }, lines);
        });
      });

      // brothers/sisters whose parents are not in the tree: join them with a bracket over their cards
      Object.values(M.families).forEach((f) => {
        if (f.partners.length || f.children.length < 2) return;
        const ns = f.children.map((c) => L.nodes.find((n) => n.pid === c && !n.dup)).filter(Boolean);
        if (ns.length < 2) return;
        const top = Math.min.apply(null, ns.map((n) => n.y)) - 26;
        const xs = ns.map((n) => n.x);
        let d = `M${Math.min.apply(null, xs)},${top}H${Math.max.apply(null, xs)}`;
        ns.forEach((n) => { d += `M${n.x + 12},${top}V${n.y}`; });
        const dim = st.focusSet && ns.some((n) => dimOf(n.pid));
        el('path', { d, class: 'ln sib' + (dim ? ' dim' : '') }, lines);
        const mid = (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2;
        const t = el('text', { x: mid, y: top - 5, 'text-anchor': 'middle', class: 'sibt' }, lines);
        t.textContent = 'siblings (parents not added yet)';
      });

      const gen0 = Math.min.apply(null, L.nodes.map((n) => n.d).concat([0]));
      // people drawn as somebody's child (their card has an incoming line from above)
      const drawnAsChild = new Set();
      L.edges.forEach((e) => { if (e.kids) e.kids.forEach((k) => { if (k.pid) drawnAsChild.add(k.pid); }); });
      L.nodes.forEach((n) => {
        const p = M.person(n.pid); if (!p) return;
        const living = M.isLiving(p);
        const cls = ['card'];
        if (!living) cls.push('dead');
        if (n.dup) cls.push('dup');
        if (st.selected && st.selected.has(n.pid)) cls.push('sel');
        if (n.root) cls.push('root');
        if (st.relId === n.pid) cls.push('rel');
        if (st.hit && st.hit.has(n.pid)) cls.push('hit');
        if (dimOf(n.pid)) cls.push('dim');
        const c = el('g', { class: cls.join(' '), transform: `translate(${n.x - S.W / 2},${n.y})`, 'data-id': n.pid, 'data-dup': n.dup ? 1 : 0 }, cards);
        let color = GENDER[p.gender] || GENDER.U;
        if (st.colorBy === 'branch' && n.branch != null) color = FT.BRANCH_COLORS[n.branch % FT.BRANCH_COLORS.length];
        if (st.colorBy === 'generation') color = GEN_COLORS[(n.d - gen0) % GEN_COLORS.length];
        if (p.color) color = p.color;
        el('rect', { class: 'bg', width: S.W, height: S.H, rx: 12 }, c);
        el('rect', { class: 'stripe', width: 6, height: S.H - 16, x: 0, y: 8, rx: 3, fill: color }, c);
        // avatar
        const ax = 30, ay = S.H / 2, ar = 19;
        if (p.photo) {
          const cid = 'cp' + n.pid + (n.dup ? 'd' : '');
          const cp = el('clipPath', { id: cid }, c); el('circle', { cx: ax, cy: ay, r: ar }, cp);
          el('image', { href: p.photo, x: ax - ar, y: ay - ar, width: ar * 2, height: ar * 2, 'clip-path': `url(#${cid})`, preserveAspectRatio: 'xMidYMid slice' }, c);
        } else {
          el('circle', { cx: ax, cy: ay, r: ar, fill: color, opacity: living ? 1 : 0.55 }, c);
          const t = el('text', { x: ax, y: ay + 5, 'text-anchor': 'middle', class: 'ini' }, c); t.textContent = initials(p);
        }
        const name = M.displayName(p);
        const tx = 56;
        const nm = el('text', { x: tx, y: 27, class: 'nm' }, c);
        nm.textContent = (n.dup ? '↪ ' : '') + fit(name, 17);
        const sub = el('text', { x: tx, y: 46, class: 'sub' }, c);
        sub.textContent = fit(years(M, p), 22);
        const tt = el('title', null, c); tt.textContent = name + (n.dup ? ' (shown elsewhere – click to jump)' : '');

        if (n.hidden) {
          const b = el('g', { class: 'badge', 'data-act': 'expand', transform: `translate(${S.W / 2 + 16},${S.H + 3})` }, c);
          el('rect', { width: 44, height: 18, rx: 9 }, b);
          const t = el('text', { x: 22, y: 13, 'text-anchor': 'middle' }, b); t.textContent = '+' + n.hidden;
          el('title', null, b).textContent = n.hidden + ' descendants hidden – click to expand';
        }
        if (n.parentsHidden && !n.dup) {
          const b = el('g', { class: 'up', 'data-act': 'show-parents', transform: `translate(${S.W - 58},-11)` }, c);
          el('rect', { width: 54, height: 18, rx: 9 }, b);
          const t = el('text', { x: 27, y: 13, 'text-anchor': 'middle' }, b); t.textContent = '▲ parents';
        }
        if (!st.readOnly && !n.dup) {
          // + handles: parent (top), child (bottom), partner (right), sibling (left)
          const H = [['parent', S.W / 2 - 34, -2, '▲'], ['child', S.W / 2, S.H + 2, '▼'], ['partner', S.W + 2, S.H / 2, '♥'], ['sibling', -2, S.H / 2, '◀']];
          H.forEach(([rel, x, y, sym]) => {
            if (rel === 'parent' && M.parents(n.pid).length >= 2) return;
            const h = el('g', { class: 'h', 'data-h': rel, transform: `translate(${x},${y})` }, c);
            el('circle', { r: 11 }, h);
            const t = el('text', { y: 5, 'text-anchor': 'middle' }, h); t.textContent = '+';
            const tip = el('title', null, h);
            tip.textContent = { parent: 'Add parent (click) · drag onto someone to make them a parent', child: 'Add child (click) · drag onto someone to make them a child', partner: 'Add partner/spouse (click) · drag onto someone to marry them', sibling: 'Add brother/sister (click) · drag onto someone to make them siblings' }[rel];
          });
          if (n.expanded) {
            const b = el('g', { class: 'badge', 'data-act': 'collapse', transform: `translate(${S.W / 2 + 16},${S.H + 4})`, opacity: 0.55 }, c);
            el('rect', { width: 22, height: 16, rx: 8 }, b);
            const t = el('text', { x: 11, y: 12, 'text-anchor': 'middle' }, b); t.textContent = '−';
            el('title', null, b).textContent = 'Collapse this branch';
          }
          if (drawnAsChild.has(n.pid)) {
            // orange dot where the parents' line arrives: drag it onto another card to make THAT person the child
            const ch = el('g', { class: 'ch', transform: `translate(${S.W / 2},0)` }, c);
            el('circle', { r: 7 }, ch);
            el('title', null, ch).textContent = 'Wrong person linked as the child? Drag this dot onto the right person (e.g. the spouse) to move the parents’ line to them.';
          }
          const ei = el('g', { class: 'edit-ic', 'data-act': 'details', transform: `translate(${S.W - 14},14)` }, c);
          el('circle', { r: 10 }, ei);
          const t = el('text', { y: 4, 'text-anchor': 'middle' }, ei); t.textContent = '✎';
          el('title', null, ei).textContent = 'Details: dates, places, photo, notes';
        }
      });
    }
  };
})();

/* FT.IO — autosave, files, GEDCOM, share copy, image export, print. */
window.FT = window.FT || {};
(function () {
  'use strict';
  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  };
  const KEY_LAST = 'ftstudio:last', KEY_TREE = 'ftstudio:tree:', KEY_BAK = 'ftstudio:backups';
  const EMBED_OPEN = '<script type="application/json" id="ft-embed">';
  const EMBED_RE = new RegExp(EMBED_OPEN.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&') + '[\\s\\S]*?<\\/script>');

  function download(name, text, type) {
    const blob = text instanceof Blob ? text : new Blob([text], { type: type || 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();

          FT.svgEl('path', { d: `M${n.x},${n.y}L${w.x},${w.y}`, stroke: '#f59e0b', 'stroke-width': 2.5 / this.view.k, 'stroke-dasharray': '6 5', fill: 'none' }, ov);
          FT.svgEl('circle', { cx: w.x, cy: w.y, r: 7 / this.view.k, fill: '#f59e0b' }, ov);
          const t = this.cardAt(e.clientX, e.clientY);

        }

          FT.svgEl('circle', { cx: w.x, cy: w.y, r: 6 / this.view.k, fill: '#16a34a' }, ov);
          const t = this.cardAt(e.clientX, e.clientY);
          this.tree.querySelectorAll('.card.drop').forEach((c) => c.classList.remove('drop'));

          $('hint').textContent = t && t.dataset.id !== d.from
            ? 'Release to make ' + this.M.displayName(t.dataset.id) + ' the ' + REL_LABEL[d.rel] + ' of ' + this.M.displayName(d.from)

          this.tree.querySelectorAll('.moving').forEach((c) => c.classList.remove('moving'));
          if (!d.moved) { this.select(d.pid, { compare: e.shiftKey }); return; }

        }

            const err = this.M.change(() => this.M.link(d.rel, d.from, t.dataset.id));
            if (err) this.toast(err);

          } else this.render();
          return;
        }
        if (d.moved) return;
        if (d.act && d.card) return this.cardAction(d.act, d.card);

      svg.addEventListener('pointerup', end);
      svg.addEventListener('pointercancel', () => { this.drag = null; svg.classList.remove('panning', 'linking'); });
      svg.addEventListener('dblclick', (e) => {
        const card = e.target.closest('.card');

        e.preventDefault();

      });
      // photo drag & drop – anywhere on the page (cards, the Details window, analytics), files or pictures from web pages
      const target = (e) => {
        const c = this.cardAt(e.clientX, e.clientY); if (c) return { pid: c.dataset.id, card: c };
        const det = e.target.closest && e.target.closest('#details');

      };
      const clear = () => this.tree.querySelectorAll('.card.drop').forEach((c) => c.classList.remove('drop'));
      document.addEventListener('dragover', (e) => {
        e.preventDefault(); // never let the browser open the picture instead of the tree
        if (this.readOnly) { try { e.dataTransfer.dropEffect = 'none'; } catch (x) { /* ignore */ } return; }

        if (!file && !urls.length) return this.toast('Nothing to use there. In the other window, right-click the picture → “Copy image”, then click the card here and press Ctrl+V.');
        if (!t) return this.toast('Drop the photo onto a person’s card (it turns green).');

    },
    /** Every picture link a drag carries, best first. */
    imageUrlsFrom(dt) {
      const out = [];
      const add = (u) => { if (!u) return; u = u.trim().replace(/&amp;/g, '&'); if (/^(https?:|data:image\/|blob:)/i.test(u) && !out.includes(u)) out.push(u); };
      let html = ''; try { html = dt.getData('text/html') || ''; } catch (x) { /* ignore */ }
      if (html) {
        const d = new DOMParser().parseFromString(html, 'text/html');
        d.querySelectorAll('img').forEach((im) => {
          const ss = (im.getAttribute('srcset') || '').split(',').map((x) => x.trim().split(/\s+/)[0]).filter(Boolean);
          if (ss.length) add(ss[ss.length - 1]);
          add(im.getAttribute('src'));
        });
        d.querySelectorAll('[style*="url("]').forEach((n) => { const m = n.getAttribute('style').match(/url\(["']?([^"')]+)/); if (m) add(m[1]); });
      }
      let list = ''; try { list = dt.getData('text/uri-list') || dt.getData('URL') || dt.getData('text/plain') || ''; } catch (x) { /* ignore */ }
      list.split(/\r?\n/).filter((l) => l && !l.startsWith('#')).forEach(add);

      const big = out.map((u) => (/^https:\/\/[^/]*(googleusercontent\.com|ggpht\.com)\//.test(u) ? u.split('?')[0].replace(/=[^/]*$/, '') + '=s1600' : u));

    },
    async photoFromDrop(pid, files, urls) {
      for (const f of files) { // whatever the browser hands over: try to read it as a picture, whatever its name or type
        try { const src = await FT.PhotoCrop.readFile(f); return this.cropPhoto(pid, src, null); } catch (e) { /* try the next thing */ }
        if (/\.hei[cf]$/i.test(f.name || '')) return this.toast('iPhone HEIC photos can’t be read by the browser. Save/export it as JPG first, then drop that.');
      }
      if (urls.length) this.status('Fetching the picture…');
      for (const u of urls) {
        try {
          const res = await fetch(u, { mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer' });
          if (!res.ok) continue;
          const src = await FT.PhotoCrop.readFile(await res.blob());

    },
    /** Card elements that move together when a person's branch is dragged: them, their partners and everyone below. */
    branchCards(pid) {
      const M = this.M, n = this.nodeOf(pid);
      const ids = new Set([pid]);
      M.descendants(pid).forEach((x) => ids.add(x));
      Array.from(ids).forEach((x) => M.partners(x).forEach((p) => ids.add(p)));
      const out = [];
      this.tree.querySelectorAll('.card').forEach((c) => {
        const ln = this.L.nodes.find((q) => q.pid === c.dataset.id);
        if (ids.has(c.dataset.id) && (!n || !ln || ln.d >= n.d)) { c.dataset.base = c.getAttribute('transform'); out.push(c); }
      });
      return out;
    },
    /** Free-move offsets are kept per view, because a hand-made arrangement only makes sense in the view it was made in. */
    viewKey() {
      return this.layoutOpts().freeKey;
    },
    /**
     * What dropping a dragged branch will do:
     *  - passed over a brother/sister  -> change birth order ("reorder")
     *  - moved up/down, or already freely placed -> place it exactly there ("free")
     *  - small sideways move            -> more/less space beside it ("space")

    planBranchDrop(d) {
      const M = this.M, n = this.nodeOf(d.pid), name = M.displayName(d.pid);
      const free = ((this.st.free || {})[this.viewKey()] || {})[d.pid];
      if (Math.abs(d.dy || 0) > S.ROW * 0.4 || free) {
        return { kind: 'free', text: '✥ Free move: ' + name + '’s family goes exactly where you drop it (lines follow). Right-click → “Put back in the tree” to undo the placement.' };
      }
      const f = M.parentFamily(d.pid);
      if (f && n) {
        const nx = n.x + (d.dx || 0);
        const sibs = f.children.filter((c) => c !== d.pid).map((c) => this.nodeOf(c)).filter((s) => s && !s.dup && s.d === n.d).sort((a, b) => a.x - b.x);
        const curIdx = sibs.filter((s) => s.x < n.x).length, newIdx = sibs.filter((s) => s.x < nx).length;

          const pos = order.indexOf(d.pid) + 1;
          const nth = pos + (pos === 1 ? 'st' : pos === 2 ? 'nd' : pos === 3 ? 'rd' : 'th');

        }
      }
      return { kind: 'space', text: '↔ Release to move ' + name + '’s branch ' + ((d.dx || 0) > 0 ? 'right' : 'left') + ' (branches to the right make room; cards never overlap). Drag up or down for a free move.' };
    },
    applyBranchDrop(d, plan) {
      const M = this.M, pid = d.pid, key = this.viewKey();

      } else if (plan.kind === 'free') {
        M.change(() => {
          const all = M.data.settings.free = Object.assign({}, M.data.settings.free);

          const o = mine[pid] || { dx: 0, dy: 0 };

    reassignChild(fromId, toId) {

      this.sel = toId; this.render();

    },
    cardAt(x, y) {
      const els = document.elementsFromPoint(x, y);

    },
    cardAction(act, pid) {
      if (act === 'expand') {
        this.st.collapsed = (this.st.collapsed || []).filter((x) => x !== pid); FT.IO.saveSoon(); this.select(pid);
      } else if (act === 'collapse') {
        this.st.collapsed = (this.st.collapsed || []).concat([pid]); FT.IO.saveSoon(); this.select(pid);
      } else if (act === 'show-parents') {
        this.st.view = 'hourglass'; this.st.rootId = pid; this.select(pid); this.centerOn(pid);
      } else if (act === 'details') { this.select(pid); this.openDetails(pid); }
    },

    // ------------------------------------------------------------------ adding people
    addFirst() {
      let id; this.M.change(() => { id = this.M.addPerson({}); });
      this.sel = id; this.render(); this.centerOn(id, false); this.startInline(id, '', true);
    },
    addRelative(rel, pid, famId) {
      const M = this.M; let id = null;

      this.ensureVisible(id);
      setTimeout(() => this.startInline(id, '', true, { rel, from: pid, undoLen }), 30);
    },

    // ------------------------------------------------------------------ inline editor
    startInline(pid, initial, isNew, meta) {
      if (this.readOnly) return;
      const p = this.M.person(pid); if (!p) return;
      this.closeMenu();
      const inp = $('inline');
      this.editing = Object.assign({ pid, isNew: !!isNew }, meta || {});
      inp.hidden = false;
      inp.value = initial !== undefined ? initial : (isNew ? '' : [p.given, p.surname].filter(Boolean).join(' '));
      inp.placeholder = isNew ? 'Type name, e.g. Ravi Sharma (1952) (M)' : 'Name';

      inp.focus();
      if (initial === undefined) inp.select(); else inp.setSelectionRange(inp.value.length, inp.value.length);

    },
    placeInline() {
      const ed = this.editing; if (!ed) return;
      const card = this.tree.querySelector(`.card[data-id="${ed.pid}"][data-dup="0"]`);
      const inp = $('inline');
      if (!card) { inp.style.left = '40%'; inp.style.top = '40%'; inp.style.width = '260px'; return; }
      const r = card.getBoundingClientRect();
      const w = Math.max(240, r.width + 40);
      inp.style.left = Math.max(4, Math.min(window.innerWidth - w - 4, r.left + r.width / 2 - w / 2)) + 'px';
      inp.style.top = Math.max(56, r.top + r.height / 2 - 18) + 'px';

      mic.style.top = (parseFloat(inp.style.top) + 1) + 'px';
    },
    /** Fill the name box by voice: offline Whisper when its engine runs, otherwise the browser's own speech service. */
    async dictate() {
      const inp = $('inline'), mic = $('inlineMic');
      if (!this.editing || !mic || !FT.Whisper) return;
      if (this._dict) { this._dict.stop(); return; }
      const done = (t) => {
        this._dict = null; mic.classList.remove('on', 'busy'); mic.style.boxShadow = '';
        if (t && this.editing) {
          inp.value = t.replace(/^(?:(?:his|her|the)\s+name\s+is|name\s+is|it'?s)\s+/i, '').replace(/[.!?,]+$/, '').trim();
          inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
          $('hint').textContent = 'Check the name, fix any letter by typing, then press Enter to save (Esc cancels).';
        }
      };
      const useWhisper = (() => { try { return (localStorage.getItem('ftstudio:voiceEngine') || 'whisper') === 'whisper'; } catch (e) { return true; } })();
      if (useWhisper && await FT.Whisper.available()) {
        mic.classList.add('on');
        $('hint').textContent = '🎤 Say the name now (offline Whisper)…';
        this._dict = await FT.Whisper.listen({
          once: true, silenceMs: 900,
          onState: (s) => { if (s === 'transcribing') { mic.classList.remove('on'); mic.classList.add('busy'); $('hint').textContent = '⏳ Writing it down…'; } if (s === 'idle' && this._dict) done(''); },
          onLevel: (v) => { mic.style.boxShadow = '0 0 0 ' + Math.round(v * 10) + 'px rgba(220,38,38,.3)'; },
          onText: done,

      const rec = new SR();
      try { rec.lang = localStorage.getItem('ftstudio:voiceLang') || 'en-IN'; } catch (e) { rec.lang = 'en-IN'; }
      rec.interimResults = false; rec.maxAlternatives = 1;
      rec.onresult = (e) => done(e.results[0][0].transcript);
      rec.onerror = () => done('');
      rec.onend = () => { if (this._dict) done(''); };
      this._dict = { stop: () => rec.stop() };

    },
    commitInline(next) {
      const ed = this.editing; if (!ed) return;

      }
      const f = FT.Paste.parseName(text);
      M.change(() => {
        p.given = f.given || ''; p.surname = f.surname || '';

        if (f.gender && f.gender !== 'U') p.gender = f.gender;

        if (f.birth && f.birth.place) p.birth.place = f.birth.place;
        if (f.death && f.death.date) p.death.date = f.death.date;
        if (f.death && f.death.place) p.death.place = f.death.place;

    /** Re-open a resizable window at the size the user last dragged it to. */
    rememberSize(box, key) {
      const k = 'ftstudio:size:' + key;
      try {
        const s = JSON.parse(localStorage.getItem(k) || 'null');
        if (s) { box.style.width = Math.min(s.w, window.innerWidth - 16) + 'px'; box.style.height = Math.min(s.h, window.innerHeight - 16) + 'px'; }
      } catch (e) { /* storage unavailable */ }
      if (box._ro || !window.ResizeObserver) return;
      let first = true;
      box._ro = new ResizeObserver(() => {
        if (first || box.hidden) { first = false; return; }
        if (!box.style.width && !box.style.height) return; // only sizes the user set by dragging
        try { localStorage.setItem(k, JSON.stringify({ w: box.offsetWidth, h: box.offsetHeight })); } catch (e) { /* ignore */ }
      });
      box._ro.observe(box);
    },
    placeDetails() {
      const box = $('details'), pid = this.detailsPid;
      const card = this.tree.querySelector(`.card[data-id="${pid}"][data-dup="0"]`);
      const bw = box.offsetWidth, bh = box.offsetHeight;
      let x = window.innerWidth - bw - 16, y = 64;
      if (card) {
        const r = card.getBoundingClientRect();
        x = r.right + 16; if (x + bw > window.innerWidth - 8) x = r.left - bw - 16;
        if (x < 8) x = Math.max(8, window.innerWidth - bw - 8);
        y = Math.max(60, Math.min(r.top - 20, window.innerHeight - bh - 10));
      }
      box.style.left = x + 'px'; box.style.top = y + 'px';
    },
    closeDetails() {
      const box = $('details'); if (box.hidden) return;
      box.hidden = true; this.detailsPid = null;
      if (this._dclose) document.removeEventListener('pointerdown', this._dclose);
      if (!this.readOnly) { this.M.endBatch(); FT.IO.saveSoon(); this.render(); }
    },
    pickPhoto(pid) {
      const inp = $('photoInput');
      inp.onchange = () => { const f = inp.files[0]; inp.value = ''; if (f) this.setPhoto(pid, f); };
      inp.click();
    },
    async setPhoto(pid, file) {
      let src;
      try { src = await FT.PhotoCrop.readFile(file); } catch (e) {
        this.toast(/\.hei[cf]$/i.test((file && file.name) || '') ? 'iPhone HEIC photos can’t be read by the browser. Open it in the Photos app and save/export it as JPG, then add that.' : 'Could not read that image.');
        return;
      }
      this.cropPhoto(pid, src, null);
    },
    /** Zoom / pan / rotate a photo so the face sits in the card's circle. */
    adjustPhoto(pid) {
      const p = this.M.person(pid); if (!p || !p.photo) return;
      this.cropPhoto(pid, p.photoSrc || p.photo, p.photoSrc ? p.photoCrop : null);

    cropPhoto(pid, src, crop) {

      if (open) this.closeDetails();
      FT.PhotoCrop.open(src, crop, (r) => {
        this.M.change(() => { const p = this.M.person(pid); p.photo = r.photo; p.photoSrc = r.photoSrc; p.photoCrop = r.photoCrop; });
        if (open) this.openDetails(pid);
      }, this.M.displayName(pid));
    },
    removePhoto(pid) { const p = this.M.person(pid); p.photo = ''; p.photoSrc = ''; p.photoCrop = null; },
    deletePerson(pid) {
      const name = this.M.displayName(pid);
      this.closeDetails();
      this.M.change(() => this.M.deletePerson(pid));
      this.sel = null; this.render();
      this.toast('Deleted ' + name, false, { label: 'Undo', fn: () => this.M.undo() });
    },

    // ------------------------------------------------------------------ toast & modal
    toast(msg, ok, action) {
      const t = $('toast'); t.innerHTML = ''; t.hidden = false;
      const s = document.createElement('span'); s.textContent = (ok ? '✔ ' : '') + msg; t.appendChild(s);
      if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { t.hidden = true; action.fn(); }; t.appendChild(b); }
      clearTimeout(this._tt); this._tt = setTimeout(() => { t.hidden = true; }, action ? 7000 : 3500);
    },
    modal(html) { $('modalBox').innerHTML = html; $('modal').hidden = false; return $('modalBox'); },
    closeModal() { $('modal').hidden = true; },

    // ------------------------------------------------------------------ paste
    pasteDialog(text) {
      const M = this.M, sel = this.sel && M.person(this.sel) ? this.sel : null;
      const box = this.modal(`<h2>📋 Paste names</h2>
        <p>Paste one name per line, or an indented outline: <b>indent</b> = child, <b>+</b> = spouse, dates in brackets, (M)/(F) for gender.</p>
        <div class="cols"><textarea id="pText" placeholder="Ramlal Sharma (1920-1995) + Kamla Devi&#10;    Suresh Sharma + Meena&#10;        Rajesh (M)&#10;        Priya (F)&#10;    Mahesh Sharma&#10;    Geeta (F)"></textarea><pre id="pPrev"></pre></div>
        <div class="opt" id="pMode"></div>
        <div class="acts"><button id="pCancel">Cancel</button><button id="pGo" class="primary">Add people</button></div>`);
      const ta = box.querySelector('#pText'); ta.value = text || '';
      let mode = null;
      const modes = () => {
        const opts = [];
        if (sel) {
          const nm = M.person(sel).given || M.displayName(sel);
          opts.push(['children', 'as children of ' + nm], ['siblings', 'as brothers/sisters of ' + nm], ['partners', 'as spouse of ' + nm]);
          if (M.parents(sel).length < 2) opts.push(['parents', 'as parents of ' + nm]);
        }
        opts.push(['none', 'as a new, separate family']);
        return opts;
      };
      const refresh = () => {
        let res; try { res = FT.Paste.parse(ta.value); } catch (e) { res = { roots: [] }; }
        const lines = [];
        let n = 0;
        const walk = (node, depth) => {
          n += 1 + node.partners.length;
          const nm = (x) => [x.given, x.surname].filter(Boolean).join(' ') + (x.gender !== 'U' ? ' (' + x.gender + ')' : '') + (x.birth.date || x.death.date ? ' [' + (x.birth.date || '?') + (x.death.date ? '–' + x.death.date : '') + ']' : '');
          lines.push('  '.repeat(depth) + (depth ? '└ ' : '• ') + nm(node.person) + node.partners.map((q) => '  ♥ ' + nm(q)).join(''));
          node.children.forEach((c) => walk(c, depth + 1));
        };
        res.roots.forEach((r) => walk(r, 0));
        box.querySelector('#pPrev').textContent = lines.length ? 'Preview – ' + n + ' people\n\n' + lines.join('\n') : 'Preview appears here';
        const single = res.roots.length === 1 && sel && [res.roots[0].person.given, res.roots[0].person.surname].join(' ').trim().toLowerCase() === M.displayName(sel).toLowerCase();
        const opts = modes(); if (single) opts.unshift(['self', 'merge into ' + M.displayName(sel) + ' (same person)']);
        if (!mode || !opts.some((o) => o[0] === mode)) mode = opts[0][0];
        const mb = box.querySelector('#pMode'); mb.innerHTML = '<span style="color:var(--ink2)">Add</span>';
        opts.forEach(([k, l]) => { const b = document.createElement('button'); b.textContent = l; b.className = k === mode ? 'on' : ''; b.onclick = () => { mode = k; refresh(); }; mb.appendChild(b); });
        box.querySelector('#pGo').disabled = !n;
        return res;
      };
      ta.addEventListener('input', refresh); refresh(); ta.focus();
      box.querySelector('#pCancel').onclick = () => this.closeModal();
      box.querySelector('#pGo').onclick = () => {
        const res = refresh(); if (!res.roots.length) return;
        let firstId = null;
        M.change(() => { firstId = this.buildFromOutline(res.roots, mode, sel); });
        this.closeModal();
        if (mode === 'none' && this.st.view !== 'everyone') this.st.view = 'everyone';
        this.render();
        if (firstId) { this.select(firstId); this.centerOn(firstId); }
        this.toast('Added people from your list', true, { label: 'Undo', fn: () => M.undo() });
      };
    },
    buildFromOutline(roots, mode, sel) {
      const M = this.M;
      const fill = (id, f) => { const p = M.person(id); const keep = p.id; Object.assign(p, FT.blankPerson(Object.assign({}, f, { id: keep }))); };
      const grow = (id, node) => {
        let firstPartner = null;
        const me = M.person(id), q0 = node.partners[0];
        if (q0 && me.gender === 'U' && q0.gender !== 'U') me.gender = q0.gender === 'F' ? 'M' : 'F';
        node.partners.forEach((q, i) => { const pid = M.addPartner(id, q); if (!i) firstPartner = pid; });
        const fam = firstPartner ? M.famsAsPartner(id).find((f) => f.partners.includes(firstPartner)) : null;
        node.children.forEach((c) => {
          const cf = Object.assign({}, c.person);
          const father = [M.person(id)].concat(firstPartner ? [M.person(firstPartner)] : []).find((x) => x.gender === 'M');
          if (!cf.surname && father && father.surname) cf.surname = father.surname;
          const cid = M.addChild(id, cf, fam && fam.id);
          grow(cid, c);
        });
        return id;
      };
      let first = null;
      roots.forEach((node) => {
        let id;
        if (mode === 'self') { id = sel; const p = M.person(sel); if (node.person.birth.date && !p.birth.date) p.birth.date = node.person.birth.date; }
        else if (mode === 'children') id = M.addChild(sel, Object.assign({}, node.person, { surname: node.person.surname || (M.person(sel).gender !== 'F' ? M.person(sel).surname : '') }));
        else if (mode === 'siblings') id = M.addSibling(sel, Object.assign({}, node.person, { surname: node.person.surname || M.person(sel).surname }));
        else if (mode === 'partners') id = M.addPartner(sel, node.person);
        else if (mode === 'parents') id = M.addParent(sel, node.person) || M.addPerson(node.person);
        else id = M.addPerson(node.person);
        if (!first) first = id;
        grow(id, node);
      });
      void fill;
      return first;
    },

    // ------------------------------------------------------------------ toolbar
    bindToolbar() {
      document.querySelectorAll('#viewSeg button').forEach((b) => b.addEventListener('click', () => {
        const v = b.dataset.view, st = this.st;
        if (v !== 'everyone') {
          let r = this.sel || st.rootId;
          if (!r) { const roots = this.M.roots(); r = roots[0]; }
          if (v === 'descendants' && !this.sel && r) r = this.M.topAncestor(r);
          st.rootId = r;
          if (!r) { this.toast('Add someone first'); return; }
        }
        st.view = v; FT.IO.saveSoon(); this.render(); this.fit();
        if (v !== 'everyone' && !this.sel) this.toast('Tip: select a person first, then pick a view to centre it on them');
      }));
      document.querySelectorAll('#focusSeg button').forEach((b) => b.addEventListener('click', () => {
        const m = b.dataset.focus, st = this.st;
        if (m === 'off') { st.focusMode = 'off'; }
        else { if (this.sel) st.focusId = this.sel; if (!st.focusId) { this.toast('Select a person first – their branch will be focused'); return; } st.focusMode = m; }
        FT.IO.saveSoon(); this.render(); if (m === 'only' || m === 'off') this.fit();
      }));
      $('colorBy').addEventListener('change', (e) => this.setting('colorBy', e.target.value));
      $('btnUndo').onclick = () => this.M.undo();
      $('btnRedo').onclick = () => this.M.redo();
      $('btnFit').onclick = () => this.fit();
      $('btnCollapse').onclick = () => this.toggleCollapseAll();
      $('btnZoomIn').onclick = () => this.zoomBy(1.25);
      $('btnZoomOut').onclick = () => this.zoomBy(0.8);
      $('btnPaste').onclick = () => this.pasteDialog('');
      $('btnHelp').onclick = () => this.help();
      $('btnLegend').onclick = () => this.legend();
      $('btnAnalytics').onclick = () => FT.AnPanel.toggle();
      $('btnFile').onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); this.fileMenu(r.right - 260, r.bottom + 6); };
      $('eAdd').onclick = () => this.addFirst();
      $('ePaste').onclick = () => this.pasteDialog('');
      $('eSample').onclick = () => this.loadData(FT.SAMPLE, 'Sample family loaded – play freely, then File → New tree to start your own');
      $('eOpen').onclick = () => this.openFile();
      const title = $('title');
      title.addEventListener('click', () => { if (this.readOnly) return; title.contentEditable = 'true'; title.focus(); document.execCommand('selectAll', false, null); });
      title.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); title.blur(); } e.stopPropagation(); });
      title.addEventListener('blur', () => {
        title.contentEditable = 'false';
        const v = title.textContent.trim();
        if (v && v !== this.M.data.meta.title) this.M.change(() => { this.M.data.meta.title = v; }); else this.render();
      });
      // search
      const s = $('search');
      s.addEventListener('input', () => {
        const q = s.value.trim().toLowerCase();
        if (!q) { this.hits = null; $('searchInfo').textContent = ''; this.render(); return; }
        const M = this.M;
        this.hits = Object.values(M.people).filter((p) => [p.given, p.surname, p.nick, p.birth.place, p.death.place].join(' ').toLowerCase().includes(q)).map((p) => p.id);
        this.hitIdx = -1;
        $('searchInfo').textContent = this.hits.length ? this.hits.length + ' found · Enter' : 'none';
        this.render();
      });
      s.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { s.value = ''; s.dispatchEvent(new Event('input')); $('stage').focus(); }
        if (e.key === 'Enter' && this.hits && this.hits.length) {
          this.hitIdx = (this.hitIdx + 1) % this.hits.length;
          const id = this.hits[this.hitIdx];
          if (!this.nodeOf(id)) { this.st.view = 'hourglass'; this.st.rootId = id; }
          this.sel = id; this.render(); this.centerOn(id);
          $('searchInfo').textContent = (this.hitIdx + 1) + ' / ' + this.hits.length;
        }
        e.stopPropagation();
      });
    },
    fileMenu(x, y) {

    async openFile() {

    loadData(data, msg) {

/* ==== voice.js ==== */
/* FT.Voice — offline, rule-based English interpreter for "Tell the Tree" voice/typed commands.
 * Mutates the model directly; the caller wraps run() in model.change(). */
window.FT = window.FT || {};

FT.Voice = (function () {
  'use strict';

  // ---------- small text helpers ----------
  var NUMW = /^(one|two|three|four|five|six|seven|eight|nine|ten)$/i;
  function isNum(w) { return NUMW.test(w) || /^\d+$/.test(w); }
  function compact(s) { return String(s || '').toLowerCase().replace(/[^\p{L}]/gu, ''); }
  function titleCase(s) {
    return String(s || '').replace(/(^|[\s-])(\p{L})(\p{L}*)/gu, function (_, pre, a, b) { return pre + a.toUpperCase() + b.toLowerCase(); });
  }
  function normalise(t) {
    return String(t == null ? '' : t).replace(/[‘’`´]/g, "'").replace(/[“”]/g, '"').replace(/\s+/g, ' ').trim();
  }
  function lev(a, b) {
    var prev = [], i, j;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      var cur = [i];
      for (j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length];
  }
  function toks(str) { return String(str).replace(/:/g, ' : ').replace(/,/g, ' , ').split(/\s+/).filter(Boolean); }

  /** parseName + title-casing; returns person fields (+ explicit: a surname was spoken). */
  function fieldsFrom(str) {
    var p = FT.Paste.parseName(str);
    var f = {
      given: titleCase(p.given), surname: titleCase(p.surname), nick: p.nick || '', gender: p.gender || 'U',
      birth: p.birth, death: p.death, living: p.living
    };
    f.explicit = !!f.surname;
    return f;
  }
  function fullC(p) { return compact((p.given || '') + (p.surname || '')); }
  function givenC(p) { return compact(p.given); }
  function strip(f) { var o = Object.assign({}, f); delete o.explicit; return o; }

  // ---------- name lookup ----------
  var PRON = /^(he|she|him|her|his|hers|their|they|them|it|its|this person|this one|selected|selected person)$/i;

  function relatedSet(model, id) {
    var s = new Set();
    [model.parents(id), model.partners(id), model.children(id), model.siblings(id)].forEach(function (a) { a.forEach(function (x) { s.add(x); }); });
    return s;
  }
  function pick(model, cands, ctx) {
    if (cands.length === 1) return cands[0];
    ctx = ctx || {};
    var prefer = ctx.prefer ? ctx.prefer.slice() : [ctx.selectedId, ctx.lastId];
    prefer = prefer.filter(function (x) { return x && model.person(x); });
    var i, j;
    for (i = 0; i < prefer.length; i++) if (cands.indexOf(prefer[i]) >= 0) return prefer[i];
    for (i = 0; i < prefer.length; i++) {
      var rel = relatedSet(model, prefer[i]);
      for (j = 0; j < cands.length; j++) if (rel.has(cands[j])) return cands[j];
    }
    return cands[0];
  }

  /** Lenient lookup: exact compact name, unique given name, fuzzy (Levenshtein <= 2), with "Sharmas" -> "Sharma" retry. */
  function findPerson(model, name, ctx) {
    ctx = ctx || {};
    var raw = normalise(name).replace(/['’]s$/i, '').replace(/^the\s+/i, '').trim();
    if (!raw) return null;
    if (PRON.test(raw)) {
      var pid = ctx.lastId || ctx.selectedId;
      return pid && model.person(pid) ? pid : null;
    }
    var pn = FT.Paste.parseName(raw);
    var c = compact(pn.given + pn.surname);
    if (!c) return null;
    var single = !pn.surname;
    var all = Object.keys(model.people).map(function (id) { return model.people[id]; });

    function stage(key, fn) { var cs = all.filter(function (p) { return fn(p) === key; }).map(function (p) { return p.id; }); return cs.length ? pick(model, cs, ctx) : null; }
    function exactOrGiven(k) { return stage(k, fullC) || stage(k, givenC); }
    function fuzzy(k) {
      if (k.length < 6) return null;
      var best = 3, cs = [];
      all.forEach(function (p) {

        if (fullC(p).length >= 6) ds.push(lev(fullC(p), k));
        if (single && givenC(p).length >= 6) ds.push(lev(givenC(p), k));
        var d = ds.length ? Math.min.apply(null, ds) : 9;
        if (d <= 2) { if (d < best) { best = d; cs = [p.id]; } else if (d === best) cs.push(p.id); }
      });

    if (r) return r;

  }

  /** Person with the exact full compact name (never the excluded ids). */
  function findExact(model, f, exclude) {
    var k = compact(f.given + f.surname);
    if (!k) return null;
    var cs = Object.keys(model.people).filter(function (id) { return (exclude || []).indexOf(id) < 0 && fullC(model.people[id]) === k; });
    return cs.length ? cs[0] : null;
  }
